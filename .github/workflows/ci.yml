name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: ruff 0.17 widened its default rule set and fails on existing code.
      - name: Install ruff
        run: python -m pip install ruff==0.15.9
      - name: Ruff check
        run: ruff check py-core tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install ./py-core[test]
      - name: Run pytest
        run: pytest

  js:
    name: JS port (node --test + demo sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JS tests
        working-directory: js-data-kr
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The live demo (docs/src) is a copy of js-data-kr/src; fail if it drifted.
      - name: Check demo copy is in sync
        run: python docs/sync_src.py --check
